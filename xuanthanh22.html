<!DOCTYPE html>
<head>   
    <title>BẢN TIN MỚI 24H</title>
    <style>
        body {
            width: 80%;
            font-family: Arial;
            background-color:white;
            margin: 0 auto;
        }
        * {
            box-sizing: border-box;
        }
        .top {
            width: 100%;
            height: 100px;
            color: blue;
            text-align: center;
            position: relative;
            background-color:#ffffff;
        }
        .top img {
            width: 80px;
            height: 80px;
            position: absolute;
            top: 10px;
            left: 10px;
            float:left;
            border-radius: 50%;
        }
        .top h1 {
            margin: 0;
            line-height: 100px;
            font-size:35px;
        }
        .meunu {
            background-color: #666666;
            width: 100%;
            padding: 5px 0;
            height: 50px;
        }
        .meunu ul {
            margin: 10px;
            padding-left: 20px;
        }
        .meunu li {
            list-style: none;
            display: inline-block;
            margin-right: 25px;
        }
        .meunu a {
            text-decoration: none;
            font-weight: bold;
            color: white;
            font-size: 16px;
        }
        .meunu a:hover{
        	color: #ff0000;
        	background-color:white;
        }
        .container {
            width: 100%;
            display: flex;
            background-color: white;
            padding: 30px;
        }
        .left {
            width: 20%;
            text-align: left;
            line-height: 35px;
        }
        .center {
            width: 45%;
        }
        .right {
        	line-height: 25px;
            width: 35%;
            padding-left: 50px;
            border-left: 1px solid #eee;
        }
        .center input[type="text"], 
        .center input[type="tel"], 
        .center select, 
        .center textarea {
            width: 100%;
            margin-bottom: 10px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .center textarea {
            height: 120px;
        }
        .center input[type="submit"]{
        	background-color:green;
        	 color: white;
        	 border: none; 
        	 padding: 5px 10px;
        	}
        .center input[type="reset"] { 
        	background-color: #0000ff; 
        	color: white; 
        	border: none; 
        	padding: 5px 10px;
        	}
        .center input[type="submit"]:hover{
        	color: white;
        }
        .center input[type="reset"]:hover{
        	color: white;
        }
        .right ul {
            list-style: none;
        }
        .right li {
            margin-bottom:12px;
        }
        .right a {
            text-decoration:none;
        }
        .bottom {
            width: 100%;
            color: black;
            background-color: #dddddd;
            text-align: center;
            padding: 15px 0;
            border-top: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div class="top">

    </div>

        <div class="right">

                <li><a href="file:///D:/thietkewebsite/HTML/bai2.html#">Tin tức trong ngày</a></li>
                <li><a href="file:///D:/thietkewebsite/HTML/bai2.html#">Thông tin chứng khoán</a></li>

            </ul>
        </div>
    </div>
